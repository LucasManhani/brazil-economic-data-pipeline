      .node-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
      .node-subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #344054; }
      .node-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #667085; }
