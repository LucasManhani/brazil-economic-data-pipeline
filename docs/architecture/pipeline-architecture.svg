<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do Brazil Economic Data Pipeline</title>
  <desc id="description">A API do Banco Central alimenta uma ingestão Python. A resposta original é arquivada no Cloud Storage e os registros são carregados no BigQuery bronze. O dbt transforma os dados nas camadas silver e gold. Airflow e Docker orquestram o fluxo localmente.</desc>

