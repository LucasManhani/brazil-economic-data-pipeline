      .layer-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #667085; }
      .flow-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475467; }
      .orchestration-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #172033; }
      .orchestration-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #667085; }
      .task-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #344054; }
